<button
  type="button"
  class="flex min-w-15 items-center gap-2 rounded border-2 bg-[#a5d8ff] px-3 py-2 text-[#1971c2] hover:brightness-95 disabled:cursor-not-allowed disabled:opacity-50"
  [class.border-[#1971c2]]="!highlighted()"
  [class.border-[#f08c00]]="highlighted()"
  [disabled]="disabled()"
  (click)="onClick()"
>
  <ng-content />
  {{ label() }}
</button>
