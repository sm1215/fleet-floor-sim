<label class="flex items-center gap-2">
  Tick
  <input
    type="range"
    min="0"
    step="1"
    aria-label="Tick"
    [max]="currentTick()"
    [value]="shown()"
    (input)="onRangeInput($event)"
  />
</label>
<input
  type="number"
  min="0"
  step="1"
  aria-label="Tick number"
  class="w-16 rounded border-2 border-[#1971c2] px-1"
  [max]="currentTick()"
  [value]="numberValue()"
  (focus)="onNumberFocus()"
  (blur)="onNumberBlur($event)"
  (input)="onNumberInput($event)"
  (change)="onNumberChange($event)"
/>
<app-button label="Fork From Here" (pressed)="onFork()" />
<select
  aria-label="Floor"
  class="rounded border-2 border-[#1971c2] bg-[#a5d8ff] px-2 py-2 text-[#1971c2]"
  (change)="onFloorChange($event)"
>
  @for (floor of floors(); track floor.id) {
    <option [value]="floor.id" [selected]="floor.id === floorId()">Floor {{ floor.id }}</option>
  }
</select>
