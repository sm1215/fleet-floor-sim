<div class="min-h-0 flex-1 overflow-y-auto border border-[#1e1e1e] p-3">
  <ol class="space-y-1">
    @for (command of commands(); track command.id) {
      <li>
        {{ command.params === null ? command.command : command.command + ' ' + command.params }}
      </li>
    }
  </ol>
</div>
<h2 class="mt-2 text-right text-black">
  @if (robotId() !== null) {
    R{{ robotId() }} Queue
  } @else {
    Queue
  }
</h2>
