<div class="flex justify-center gap-4 text-sm [grid-area:sliders]">
  <label class="flex items-center gap-2">
    Width
    <input
      type="range"
      min="1"
      max="20"
      step="1"
      aria-label="Width"
      [disabled]="readOnly()"
      [value]="width()"
      (input)="width.set($any($event.target).valueAsNumber)"
      (change)="onSizeChange()"
    />
    <span>{{ width() }}</span>
  </label>
  <label class="flex items-center gap-2">
    Height
    <input
      type="range"
      min="1"
      max="20"
      step="1"
      aria-label="Height"
      [disabled]="readOnly()"
      [value]="height()"
      (input)="height.set($any($event.target).valueAsNumber)"
      (change)="onSizeChange()"
    />
    <span>{{ height() }}</span>
  </label>
</div>
@if (floor(); as floor) {
  <div class="grid w-fit grid-cols-[auto_auto] text-xs [grid-area:grid]">
    <div
      class="row-labels grid pr-1"
      [style.grid-template-rows]="'repeat(' + floor.height + ', ' + cellSize() + 'px)'"
    >
      @for (y of rowLabels(); track y) {
        <span class="flex items-center justify-end">{{ y }}</span>
      }
    </div>
    <div
      class="floor grid w-fit"
      [style.grid-template-columns]="'repeat(' + floor.width + ', ' + cellSize() + 'px)'"
      [style.grid-template-rows]="'repeat(' + floor.height + ', ' + cellSize() + 'px)'"
    >
      @for (cell of orderedCells(); track cell.id) {
        @let robot = robotsByCell().get(cell.id);
        <app-cell
          [cell]="cell"
          [robot]="robot"
          [editMode]="editMode()"
          [selected]="robot !== undefined && robot.id === selectedRobotId()"
          (clicked)="onCellClick(cell)"
          (robotClicked)="robotClicked.emit(robot!.id)"
          [attr.data-x]="cell.xPosition"
          [attr.data-y]="cell.yPosition"
        />
      }
    </div>
    <div></div>
    <div
      class="column-labels grid pt-1"
      [style.grid-template-columns]="'repeat(' + floor.width + ', ' + cellSize() + 'px)'"
    >
      @for (x of columnLabels(); track x) {
        <span class="text-center">{{ x }}</span>
      }
    </div>
  </div>
}
