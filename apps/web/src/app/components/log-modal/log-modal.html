<dialog
  #dialog
  class="m-auto h-[70vh] w-[80vw] max-w-3xl rounded bg-white p-6 shadow-lg backdrop:bg-black/40"
  aria-label="Log"
  (cancel)="close($event)"
>
  <button
    type="button"
    class="absolute top-2 right-3 flex h-6 w-6 cursor-pointer items-center justify-center rounded border-2 border-[#1971c2] bg-[#a5d8ff] leading-none text-[#1971c2] hover:brightness-95"
    aria-label="Close"
    (click)="close()"
  >
    X
  </button>
  <ol class="mt-4 font-mono text-sm">
    @for (e of entries(); track e.id) {
      <li class="whitespace-pre-line">{{ e.action }} {{ e.params }}: {{ e.result }}</li>
    }
  </ol>
</dialog>
