<div
  class="cell box-border h-full w-full border p-[8%]"
  [class.border-black]="!editMode()"
  [class.border-[#f08c00]]="editMode()"
  [class.obstacle]="cell().obstacle"
  [class.bg-[#e03131]]="cell().obstacle"
  role="button"
  tabindex="0"
  (mousedown)="onMouseDown($event)"
  (click)="clicked.emit({ shiftKey: $event.shiftKey })"
  (keydown.enter)="clicked.emit({ shiftKey: $any($event).shiftKey })"
>
  @if (robot(); as robot) {
    <app-robot [robot]="robot" [selected]="selected()" (clicked)="robotClicked.emit()" />
  }
</div>
