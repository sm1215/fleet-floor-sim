<main class="layout mx-auto max-w-6xl p-4">
  <h1 class="sr-only">Fleet Floor Simulator</h1>

  <div class="area-top flex justify-end gap-3">
    <app-button label="Step" (pressed)="onStep()" />
    <app-button label="Play / Pause" (pressed)="onPlayPause()" />
    <app-button label="Edit" (pressed)="onToggleEdit()" />
    <app-button label="Log" (pressed)="onOpenLog()" />
  </div>

  <app-grid class="area-grid" [floor]="floor()" [cells]="cells()" [robots]="robots()" />

  <app-queue-panel class="area-queue" [robotId]="selectedRobotId()" [commands]="queue()" />

  <div class="area-controls flex gap-3">
    <app-button label="Turn Left" (pressed)="onTurnLeft()" />
    <app-button label="Turn Right" (pressed)="onTurnRight()" />
    <app-button label="Move" (pressed)="onMove()" />
  </div>
</main>

@if (logOpen()) {
  <app-log-modal (closed)="onCloseLog()" />
}
